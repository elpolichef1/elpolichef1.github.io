<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Carrera Multijugador | AprobadoYa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0a2f2a 0%, #061a14 100%);
            min-height: 100vh;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container { max-width: 550px; width: 100%; }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 48px;
            padding: 45px 35px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 25px 45px rgba(0,0,0,0.3);
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff, #fbbf24);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        h1 i { color: #fbbf24; margin-right: 10px; background: none; -webkit-background-clip: unset; }
        .subtitle { color: #a8c4b8; margin-bottom: 35px; font-size: 0.95rem; }
        
        .car-selector {
            background: rgba(0,0,0,0.3);
            border-radius: 28px;
            padding: 20px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .car-selector p { margin-bottom: 15px; font-size: 0.9rem; color: #fbbf24; }
        .car-options {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .car-option {
            background: rgba(255,255,255,0.1);
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 2px solid transparent;
        }
        .car-option span { font-size: 0.75rem; color: #a8c4b8; }
        .car-option:hover { background: rgba(251,191,36,0.3); transform: scale(1.05); }
        .car-option.selected { background: #fbbf24; border-color: white; }
        .car-option.selected span { color: #1a472a; font-weight: bold; }
        
        .btn {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a472a;
            border: none;
            padding: 16px 30px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-bottom: 12px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(251,191,36,0.4); }
        .btn-outline { background: transparent; border: 2px solid #fbbf24; color: #fbbf24; }
        .btn-outline:hover { background: #fbbf24; color: #1a472a; }
        
        .codigo-container {
            background: rgba(0,0,0,0.3);
            border-radius: 28px;
            padding: 20px;
            margin: 15px 0;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .codigo-container p { margin-bottom: 12px; font-size: 0.9rem; opacity: 0.8; }
        .codigo-input {
            display: flex;
            gap: 12px;
        }
        .codigo-input input {
            flex: 1;
            padding: 14px;
            border-radius: 60px;
            border: none;
            font-size: 1rem;
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
            background: white;
            color: #1a472a;
            text-transform: uppercase;
        }
        .codigo-input input:focus { outline: none; box-shadow: 0 0 0 3px rgba(251,191,36,0.5); }
        .codigo-input button {
            background: #fbbf24;
            border: none;
            padding: 14px 28px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            font-size: 1rem;
            color: #1a472a;
        }
        .codigo-input button:hover { background: #f59e0b; }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
            color: #94a3b8;
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .divider::before { margin-right: 15px; }
        .divider::after { margin-left: 15px; }
        
        .volver {
            display: inline-block;
            margin-top: 20px;
            color: #fbbf24;
            text-decoration: none;
            font-size: 0.9rem;
            opacity: 0.7;
            transition: 0.3s;
        }
        .volver:hover { opacity: 1; color: white; }
        
        .waiting-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(15px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .waiting-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px);
            border-radius: 60px;
            padding: 50px;
            text-align: center;
            max-width: 450px;
            width: 90%;
            border: 1px solid rgba(251,191,36,0.4);
        }
        .waiting-spinner {
            width: 70px;
            height: 70px;
            border: 4px solid rgba(255,255,255,0.15);
            border-top-color: #fbbf24;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 25px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .waiting-codigo {
            background: rgba(0,0,0,0.5);
            padding: 25px;
            border-radius: 35px;
            margin: 25px 0;
        }
        .waiting-codigo span {
            font-size: 2.5rem;
            letter-spacing: 10px;
            font-weight: 800;
            color: #fbbf24;
        }
        .btn-cancelar {
            background: rgba(255,255,255,0.15);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-cancelar:hover { background: rgba(255,255,255,0.25); }
        
        .btn-unirse-demo {
            background: #10b981;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.3s;
            font-weight: 600;
        }
        .btn-unirse-demo:hover { background: #059669; transform: scale(1.05); }
        
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 16px 30px;
            border-radius: 16px;
            z-index: 3000;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 90%;
        }
        .toast.error { border-left: 4px solid #ef4444; }
        .toast.success { border-left: 4px solid #10b981; }
        .toast.show { display: flex; animation: slideDown 0.3s ease; }
        @keyframes slideDown {
            from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        @media (max-width: 560px) {
            .card { padding: 30px 20px; }
            h1 { font-size: 1.6rem; }
            .waiting-codigo span { font-size: 1.6rem; letter-spacing: 5px; }
            .car-option { padding: 8px 12px; font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1><i class="fas fa-flag-checkered"></i> Carrera Multijugador</h1>
            <p class="subtitle">🏁 ¡Compite contra otro jugador en tiempo real! 🏁</p>

            <div class="car-selector">
                <p><i class="fas fa-car"></i> Elige tu coche:</p>
                <div class="car-options" id="carOptions">
                    <div class="car-option selected" data-car="🏎️">🏎️ <span>F1</span></div>
                    <div class="car-option" data-car="🚗">🚗 <span>Sedán</span></div>
                    <div class="car-option" data-car="🚙">🚙 <span>SUV</span></div>
                    <div class="car-option" data-car="🏍️">🏍️ <span>Moto</span></div>
                    <div class="car-option" data-car="🚕">🚕 <span>Taxi</span></div>
                    <div class="car-option" data-car="🚓">🚓 <span>Policía</span></div>
                </div>
            </div>

            <button class="btn" id="btnAleatorio">
                <i class="fas fa-random"></i> Emparejamiento aleatorio
            </button>

            <div class="divider">o</div>

            <div class="codigo-container">
                <p><i class="fas fa-link"></i> Crear partida privada</p>
                <button class="btn btn-outline" id="btnCrearPartida">
                    <i class="fas fa-plus-circle"></i> Crear partida
                </button>
            </div>

            <div class="codigo-container">
                <p><i class="fas fa-door-open"></i> Unirse con código</p>
                <div class="codigo-input">
                    <input type="text" id="codigoInput" placeholder="Código 6 dígitos" maxlength="6" inputmode="numeric" autocomplete="off">
                    <button id="btnUnirse"><i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <a href="../index.html" class="volver"><i class="fas fa-arrow-left"></i> Volver a juegos</a>
        </div>
    </div>

    <div id="toast" class="toast">
        <i id="toastIcon" class="fas fa-info-circle"></i>
        <span id="toastMessage">Mensaje</span>
    </div>

    <div id="waitingScreen" class="waiting-screen">
        <div class="waiting-card">
            <div class="waiting-spinner"></div>
            <h2><i class="fas fa-users"></i> Esperando oponente...</h2>
            <div class="waiting-codigo">
                <p style="margin-bottom: 10px;">📋 Código de la sala:</p>
                <span id="waitingCodigo">------</span>
            </div>
            <p style="color: #a8c4b8; animation: pulse 1.5s infinite;">🔗 Comparte este código con tu amigo</p>
            <button class="btn-unirse-demo" id="btnSimularOponente">
                <i class="fas fa-user-plus"></i> Simular oponente (demo)
            </button>
            <button class="btn-cancelar" id="btnCancelarEspera">
                <i class="fas fa-times"></i> Cancelar
            </button>
        </div>
    </div>

    <style>
        @keyframes pulse {
            0%,100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>

    <script>
        // ============================================
        // VERSIÓN SIMPLE CON LOCALSTORAGE
        // ============================================
        
        let cocheSeleccionado = localStorage.getItem('multiplayer_car') || '🏎️';
        let salaIdActual = null;
        let checkInterval = null;
        
        // Inicializar selector de coches
        function initCarSelector() {
            document.querySelectorAll('.car-option').forEach(opt => {
                if (opt.dataset.car === cocheSeleccionado) {
                    opt.classList.add('selected');
                }
                opt.addEventListener('click', () => {
                    document.querySelectorAll('.car-option').forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    cocheSeleccionado = opt.dataset.car;
                    localStorage.setItem('multiplayer_car', cocheSeleccionado);
                });
            });
        }
        
        function generarCodigo() {
            return String(Math.floor(100000 + Math.random() * 900000));
        }
        
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            toast.className = `toast ${type}`;
            icon.className = type === 'error' ? 'fas fa-exclamation-circle' : 'fas fa-check-circle';
            msg.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => toast.classList.remove('show'), 3000);
        }
        
        // CREAR PARTIDA
        function crearPartida() {
            const codigo = generarCodigo();
            const salaId = 'sala_' + Date.now();
            
            const partida = {
                codigo: codigo,
                jugador1: cocheSeleccionado,
                jugador2: null,
                turno: 0,
                puntuacion1: 0,
                puntuacion2: 0,
                preguntas: null,
                estado: 'esperando'
            };
            
            localStorage.setItem(salaId, JSON.stringify(partida));
            localStorage.setItem('partida_actual', salaId);
            
            showToast('✅ Partida creada! Código: ' + codigo, 'success');
            return { salaId, codigo };
        }
        
        // BUSCAR PARTIDA POR CÓDIGO
        function buscarPartida(codigo) {
            for (let key in localStorage) {
                if (key.startsWith('sala_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data.codigo === codigo) {
                            return { key, data };
                        }
                    } catch(e) {}
                }
            }
            return null;
        }
        
        // UNIRSE A PARTIDA
        function unirsePartida(codigo) {
            const resultado = buscarPartida(codigo);
            
            if (!resultado) {
                showToast('❌ Partida no encontrada', 'error');
                return null;
            }
            
            const { key, data } = resultado;
            
            if (data.jugador2) {
                showToast('❌ Partida llena', 'error');
                return null;
            }
            
            data.jugador2 = cocheSeleccionado;
            data.estado = 'en_curso';
            localStorage.setItem(key, JSON.stringify(data));
            localStorage.setItem('partida_actual', key);
            
            showToast('✅ Unido a la partida!', 'success');
            return key;
        }
        
        // BUSCAR PARTIDA ALEATORIA
        function buscarPartidaAleatoria() {
            for (let key in localStorage) {
                if (key.startsWith('sala_')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data.estado === 'esperando' && !data.jugador2) {
                            data.jugador2 = cocheSeleccionado;
                            data.estado = 'en_curso';
                            localStorage.setItem(key, JSON.stringify(data));
                            localStorage.setItem('partida_actual', key);
                            return key;
                        }
                    } catch(e) {}
                }
            }
            return null;
        }
        
        function mostrarEspera(codigo, salaId) {
            salaIdActual = salaId;
            document.getElementById('waitingCodigo').textContent = codigo;
            document.getElementById('waitingScreen').style.display = 'flex';
            
            // Verificar cada segundo si alguien se unió
            if (checkInterval) clearInterval(checkInterval);
            checkInterval = setInterval(() => {
                const data = localStorage.getItem(salaId);
                if (data) {
                    try {
                        const partida = JSON.parse(data);
                        if (partida.jugador2) {
                            clearInterval(checkInterval);
                            window.location.href = 'carrera-multijugador.html?sala=' + salaId;
                        }
                    } catch(e) {}
                }
            }, 1000);
        }
        
        function ocultarEspera() {
            document.getElementById('waitingScreen').style.display = 'none';
            if (checkInterval) clearInterval(checkInterval);
        }
        
        // ============================================
        // EVENTOS
        // ============================================
        
        initCarSelector();
        
        // Emparejamiento aleatorio
        document.getElementById('btnAleatorio').addEventListener('click', () => {
            let salaId = buscarPartidaAleatoria();
            if (!salaId) {
                const { salaId: nueva, codigo } = crearPartida();
                mostrarEspera(codigo, nueva);
            } else {
                window.location.href = 'carrera-multijugador.html?sala=' + salaId;
            }
        });
        
        // Crear partida
        document.getElementById('btnCrearPartida').addEventListener('click', () => {
            const { salaId, codigo } = crearPartida();
            mostrarEspera(codigo, salaId);
        });
        
        // Unirse
        document.getElementById('btnUnirse').addEventListener('click', () => {
            const codigo = document.getElementById('codigoInput').value.trim();
            if (codigo.length !== 6) {
                showToast('❌ Código de 6 dígitos', 'error');
                return;
            }
            
            const salaId = unirsePartida(codigo);
            if (salaId) {
                window.location.href = 'carrera-multijugador.html?sala=' + salaId;
            }
        });
        
        // Enter en input
        document.getElementById('codigoInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') document.getElementById('btnUnirse').click();
        });
        
        // Simular oponente
        document.getElementById('btnSimularOponente').addEventListener('click', () => {
            if (!salaIdActual) return;
            
            const data = localStorage.getItem(salaIdActual);
            if (data) {
                try {
                    const partida = JSON.parse(data);
                    if (!partida.jugador2) {
                        partida.jugador2 = '🚗';
                        partida.estado = 'en_curso';
                        localStorage.setItem(salaIdActual, JSON.stringify(partida));
                        showToast('✅ Oponente simulado!', 'success');
                        setTimeout(() => {
                            window.location.href = 'carrera-multijugador.html?sala=' + salaIdActual;
                        }, 500);
                    }
                } catch(e) {}
            }
        });
        
        // Cancelar
        document.getElementById('btnCancelarEspera').addEventListener('click', () => {
            ocultarEspera();
            if (salaIdActual) {
                localStorage.removeItem(salaIdActual);
                localStorage.removeItem('partida_actual');
            }
        });
    </script>
</body>
</html>
