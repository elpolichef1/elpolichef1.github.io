<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrera Multijugador DGT</title>

  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .contenedor {
      width: min(500px, 90%);
      background: #1f2937;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 40px #0008;
    }

    h1 {
      margin-top: 0;
    }

    input, button, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      margin: 8px 0;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
    }

    input {
      background: #374151;
      color: white;
    }

    button {
      cursor: pointer;
      background: #2563eb;
      color: white;
      font-weight: bold;
    }

    button:hover {
      background: #1d4ed8;
    }

    .codigo {
      font-size: 32px;
      font-weight: bold;
      letter-spacing: 5px;
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      margin: 15px 0;
    }

    .estado {
      margin-top: 15px;
      color: #d1d5db;
    }

    .coches {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .coche {
      font-size: 30px;
      padding: 12px 5px;
      background: #374151;
      border-radius: 10px;
      cursor: pointer;
    }

    .coche.seleccionado {
      outline: 3px solid #22c55e;
      background: #065f46;
    }

    .oculto {
      display: none;
    }
  </style>
</head>

<body>

<div class="contenedor">

  <h1>🏁 Carrera Multijugador DGT</h1>

  <h3>Elige tu coche</h3>

  <div class="coches">
    <div class="coche seleccionado" data-car="🏎️">🏎️</div>
    <div class="coche" data-car="🚗">🚗</div>
    <div class="coche" data-car="🚙">🚙</div>
    <div class="coche" data-car="🏎️">🏎️</div>
    <div class="coche" data-car="🚕">🚕</div>
    <div class="coche" data-car="🚓">🚓</div>
    <div class="coche" data-car="🚑">🚑</div>
    <div class="coche" data-car="🚒">🚒</div>
  </div>

  <hr>

  <button id="crearBtn">🎮 Crear partida</button>

  <div id="salaCreada" class="oculto">

    <p>Comparte este código con tu rival:</p>

    <div id="codigo" class="codigo">------</div>

    <button id="copiarBtn">📋 Copiar código</button>

    <p id="estadoHost" class="estado">
      Esperando al otro jugador...
    </p>

  </div>

  <hr>

  <h3>Unirse a una partida</h3>

  <input
    id="codigoInput"
    type="text"
    maxlength="6"
    inputmode="numeric"
    placeholder="Código de 6 números"
  >

  <button id="unirseBtn">
    🚀 Unirse a partida
  </button>

  <p id="estado" class="estado"></p>

</div>

<script>
"use strict";

const PREFIX = "aprobadoya-dgt-";

let peer = null;
let connection = null;
let cocheSeleccionado = "🏎️";
let codigoSala = null;


/* =========================
   SELECCIÓN DEL COCHE
========================= */

document.querySelectorAll(".coche").forEach(coche => {

  coche.addEventListener("click", () => {

    document.querySelectorAll(".coche")
      .forEach(x => x.classList.remove("seleccionado"));

    coche.classList.add("seleccionado");

    cocheSeleccionado = coche.dataset.car;
  });

});


/* =========================
   GENERAR CÓDIGO
========================= */

function generarCodigo() {

  return Math.floor(
    100000 + Math.random() * 900000
  ).toString();

}


/* =========================
   CREAR PARTIDA
========================= */

document.getElementById("crearBtn").addEventListener("click", () => {

  codigoSala = generarCodigo();

  const peerId = PREFIX + codigoSala;

  mostrarEstado("Creando partida...");

  peer = new Peer(peerId, {
    debug: 0
  });


  peer.on("open", id => {

    console.log("Sala creada:", id);

    document.getElementById("codigo").textContent = codigoSala;

    document
      .getElementById("salaCreada")
      .classList.remove("oculto");

    document.getElementById("crearBtn").disabled = true;

    mostrarEstadoHost(
      "Esperando al segundo jugador..."
    );

  });


  peer.on("connection", conn => {

    connection = conn;

    mostrarEstadoHost(
      "Jugador encontrado. Conectando..."
    );

    conn.on("open", () => {

      console.log("Jugador conectado");

      const url =
        "carrera-multijugador.html" +
        "?sala=" + encodeURIComponent(codigoSala) +
        "&rol=host" +
        "&coche=" + encodeURIComponent(cocheSeleccionado);

      window.location.href = url;

    });

  });


  peer.on("error", error => {

    console.error(error);

    if (error.type === "unavailable-id") {

      mostrarEstado(
        "Ese código ya está ocupado. Creando otro..."
      );

      if (peer) {
        peer.destroy();
      }

      setTimeout(() => {
        document.getElementById("crearBtn").click();
      }, 500);

      return;
    }

    mostrarEstado(
      "Error de conexión: " + error.type
    );

  });

});


/* =========================
   UNIRSE
========================= */

document.getElementById("unirseBtn").addEventListener("click", () => {

  const codigo =
    document.getElementById("codigoInput")
      .value
      .trim();

  if (!/^\d{6}$/.test(codigo)) {

    mostrarEstado(
      "Introduce un código válido de 6 números."
    );

    return;
  }


  mostrarEstado("Conectando con la partida...");


  peer = new Peer({
    debug: 0
  });


  peer.on("open", () => {

    const peerId = PREFIX + codigo;

    connection = peer.connect(
      peerId,
      {
        reliable: true,
        serialization: "json",
        metadata: {
          car: cocheSeleccionado
        }
      }
    );


    connection.on("open", () => {

      console.log("Conectado al anfitrión");

      const url =
        "carrera-multijugador.html" +
        "?sala=" + encodeURIComponent(codigo) +
        "&rol=guest" +
        "&coche=" + encodeURIComponent(cocheSeleccionado);

      window.location.href = url;

    });


    connection.on("error", error => {

      console.error(error);

      mostrarEstado(
        "No se pudo conectar con la partida."
      );

    });


    connection.on("close", () => {

      mostrarEstado(
        "El anfitrión cerró la partida."
      );

    });

  });


  peer.on("error", error => {

    console.error(error);

    mostrarEstado(
      "No se encontró esa partida."
    );

  });

});


/* =========================
   COPIAR CÓDIGO
========================= */

document.getElementById("copiarBtn").addEventListener("click", async () => {

  try {

    await navigator.clipboard.writeText(codigoSala);

    document.getElementById("copiarBtn").textContent =
      "✅ Código copiado";

  } catch {

    mostrarEstado(
      "No se pudo copiar automáticamente."
    );

  }

});


/* =========================
   MENSAJES
========================= */

function mostrarEstado(texto) {

  document.getElementById("estado").textContent =
    texto;

}

function mostrarEstadoHost(texto) {

  document.getElementById("estadoHost").textContent =
    texto;

}


/* =========================
   LIMPIEZA
========================= */

window.addEventListener("beforeunload", () => {

  if (peer) {
    try {
      peer.destroy();
    } catch {}
  }

});

</script>

</body>
</html>
