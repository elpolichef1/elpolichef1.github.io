<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pasapalabra DGT | Mini Retos</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * { font-family: 'Inter', sans-serif; }

        /* ============ HEADER DEL JUEGO ============ */
        .game-header {
            background: linear-gradient(135deg, #1a472a 0%, #0f2a1a 100%);
            color: white;
            padding: 30px 0;
            text-align: center;
        }
        .game-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .game-header h1 i { color: #fbbf24; }
        .game-header p { opacity: 0.9; }

        /* ============ CONTENEDOR ============ */
        .game-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }

        /* ============ MENÚ DE NIVELES ============ */
        .niveles-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        .nivel-card {
            background: white;
            border-radius: 25px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 2px solid #e2e8f0;
        }
        .nivel-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 15px 35px rgba(251,191,36,0.25);
        }
        .nivel-card.facil:hover { border-color: #22c55e; }
        .nivel-card.medio:hover { border-color: #fbbf24; }
        .nivel-card.dificil:hover { border-color: #ef4444; }

        .nivel-emoji {
            font-size: 3rem;
            margin-bottom: 12px;
            display: block;
        }
        .nivel-card h3 {
            font-size: 1.3rem;
            color: #1a472a;
            margin-bottom: 8px;
            font-weight: 800;
        }
        .nivel-card .desc {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        .nivel-card .stats {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 0.8rem;
            color: #94a3b8;
            font-weight: 600;
        }
        .nivel-card .stats i { color: #fbbf24; }

        /* ============ SCORE BOARD (igual que memoria) ============ */
        .score-board {
            display: flex;
            justify-content: space-between;
            background: white;
            border-radius: 25px;
            padding: 20px 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
        }
        .score-item { text-align: center; flex: 1; }
        .score-value { font-size: 2rem; font-weight: 800; color: #fbbf24; }
        .score-value.aciertos { color: #10b981; }
        .score-value.fallos { color: #ef4444; }
        .score-value.pendientes { color: #64748b; }
        .score-value.timer-num { color: #1a472a; }
        .score-value.timer-num.alerta { color: #ef4444; }
        .score-label { font-size: 0.8rem; color: #64748b; margin-top: 5px; }

        /* ============ BARRA DE NIVEL ACTUAL ============ */
        .nivel-badge-wrap {
            text-align: center;
            margin-bottom: 20px;
        }
        .nivel-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 700;
        }
        .nivel-badge.facil { background: #d1fae5; color: #065f46; }
        .nivel-badge.medio { background: #fef3c7; color: #b45309; }
        .nivel-badge.dificil { background: #fee2e2; color: #991b1b; }

        /* ============ TIMER CIRCULAR ============ */
        .timer-wrap {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .timer-circle {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: conic-gradient(#fbbf24 100%, #e2e8f0 0);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: background 0.3s;
            box-shadow: 0 8px 25px rgba(251,191,36,0.25);
        }
        .timer-circle::after {
            content: "";
            position: absolute;
            inset: 10px;
            border-radius: 50%;
            background: white;
        }
        .timer-number {
            position: relative;
            z-index: 1;
            font-size: 1.7rem;
            font-weight: 800;
            color: #1a472a;
        }
        .timer-circle.alert { box-shadow: 0 8px 25px rgba(239,68,68,0.35); }

        /* ============ ROSCO ============ */
        .rosco-wrap {
            position: relative;
            width: min(520px, 100%);
            aspect-ratio: 1;
            margin: 0 auto 30px;
        }
        .rosco {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a472a, #0f2a1a);
            box-shadow: 0 15px 40px rgba(26,71,42,0.3);
        }
        .letra {
            position: absolute;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.2rem;
            color: #1a472a;
            border: 3px solid #e2e8f0;
            transition: all 0.3s;
            transform: translate(-50%, -50%);
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }
        .letra.actual {
            background: #fbbf24;
            border-color: #f59e0b;
            color: #1a472a;
            transform: translate(-50%, -50%) scale(1.15);
            box-shadow: 0 0 0 6px rgba(251,191,36,0.3);
            z-index: 2;
        }
        .letra.acierto {
            background: #22c55e;
            border-color: #16a34a;
            color: white;
        }
        .letra.fallo {
            background: #ef4444;
            border-color: #dc2626;
            color: white;
        }
        .letra.pendiente {
            background: #64748b;
            border-color: #475569;
            color: white;
        }

        /* ============ TARJETA DE PREGUNTA ============ */
        .pregunta-card {
            background: white;
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 20px;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }
        .letra-actual {
            font-size: 2.8rem;
            font-weight: 800;
            color: #fbbf24;
            line-height: 1;
            margin-bottom: 10px;
        }
        .definicion {
            font-size: 1.15rem;
            font-weight: 600;
            color: #1a472a;
            line-height: 1.5;
        }
        .pista {
            margin-top: 10px;
            font-size: 0.85rem;
            color: #94a3b8;
            font-style: italic;
        }

        /* ============ INPUT + BOTONES ============ */
        .respuesta-form {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }
        .respuesta-form input {
            flex: 1;
            min-width: 200px;
            padding: 16px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            font-size: 1rem;
            font-family: inherit;
            background: white;
            color: #1e293b;
            transition: all 0.25s;
        }
        .respuesta-form input:focus {
            outline: none;
            border-color: #fbbf24;
            box-shadow: 0 0 0 4px rgba(251,191,36,0.2);
        }
        .respuesta-form button {
            padding: 16px 26px;
            border: 0;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-responder {
            background: linear-gradient(135deg, #1a472a, #0f2a1a);
            color: white;
        }
        .btn-responder:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(26,71,42,0.35); }
        .btn-pasar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a472a;
        }
        .btn-pasar:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(251,191,36,0.4); }

        .feedback {
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            min-height: 26px;
            margin-top: 8px;
            transition: all 0.3s;
        }
        .feedback.ok { color: #16a34a; }
        .feedback.err { color: #dc2626; }

        /* ============ BOTÓN REINICIAR (igual que memoria) ============ */
        .btn-reiniciar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a472a;
            border: none;
            padding: 14px 30px;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }
        .btn-reiniciar:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251,191,36,0.3);
        }

        /* ============ MENSAJE FINAL (igual que memoria) ============ */
        .mensaje-victoria {
            text-align: center;
            padding: 35px 30px;
            background: #d1fae5;
            border-radius: 25px;
            margin-top: 25px;
            animation: celebrate 0.4s ease;
        }
        .mensaje-victoria h2 {
            color: #10b981;
            font-size: 1.8rem;
            margin: 12px 0;
        }
        .mensaje-victoria p { margin-bottom: 8px; color: #1e293b; }
        .mensaje-victoria .puntos-finales {
            font-size: 3rem;
            font-weight: 800;
            color: #fbbf24;
            line-height: 1;
            margin: 12px 0;
        }

        .acciones-finales {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .acciones-finales button,
        .acciones-finales a {
            background: #fbbf24;
            color: #1a472a;
            border: none;
            padding: 12px 26px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-family: inherit;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95rem;
        }
        .acciones-finales button:hover,
        .acciones-finales a:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(251,191,36,0.4);
        }
        .acciones-finales .btn-secundario {
            background: #f1f5f9;
            color: #1e293b;
        }
        .acciones-finales .btn-verde {
            background: linear-gradient(135deg, #1a472a, #0f2a1a);
            color: white;
        }
        .acciones-finales .btn-verde:hover {
            box-shadow: 0 5px 15px rgba(26,71,42,0.35);
        }

        @keyframes celebrate {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        /* ============ REPASO FINAL ============ */
        .repaso {
            text-align: left;
            max-width: 540px;
            margin: 20px auto;
            background: white;
            border-radius: 16px;
            padding: 18px;
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }
        .repaso .fila {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.9rem;
        }
        .repaso .fila:last-child { border-bottom: none; }
        .repaso b { color: #fbbf24; font-size: 1.1rem; }

        /* ============ RESPONSIVE ============ */
        @media (max-width: 768px) {
            .niveles-grid { grid-template-columns: 1fr; gap: 15px; }
            .rosco-wrap { width: 92%; }
            .letra { width: 36px; height: 36px; font-size: 0.95rem; border-width: 2px; }
            .timer-circle { width: 90px; height: 90px; }
            .timer-number { font-size: 1.4rem; }
            .definicion { font-size: 1rem; }
            .letra-actual { font-size: 2rem; }
            .respuesta-form input { padding: 14px 16px; font-size: 0.95rem; }
            .respuesta-form button { padding: 14px 18px; font-size: 0.9rem; }
            .score-value { font-size: 1.5rem; }
            .score-board { padding: 15px; }
            .mensaje-victoria h2 { font-size: 1.4rem; }
            .mensaje-victoria .puntos-finales { font-size: 2.4rem; }
            .game-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>

                {letra:"X", palabra:"XENÓN", definicion:"Contiene la X: gas usado en algunos faros de alta intensidad.", pista:"Tipo de faro moderno"},
                {letra:"Y", palabra:"YIELD", definicion:"Contiene la Y: palabra inglesa para 'ceda el paso'.", pista:"Ceda el paso en inglés"},
                {letra:"Z", palabra:"ZANJA", definicion:"Excavación en la vía que puede provocar un accidente si no está señalizada.", pista:"Excavación en la calzada"}
            ]
        },
        dificil: {
            nombre: "Difícil",
            emoji: "🔴",
            desc: "Palabras técnicas de la DGT y reglamento de circulación.",
            tiempo: 120,
            clase: "dificil",
            rosco: [
                {letra:"A", palabra:"ALCOHOLEMIA", definicion:"Tasa de alcohol en sangre permitida legalmente al conducir.", pista:"Nivel de alcohol en sangre"},
                {letra:"B", palabra:"BALIZA", definicion:"Señal reflectante que indica el borde de la calzada o peligro.", pista:"Señal reflectante"},
                {letra:"C", palabra:"CICLOMOTOR", definicion:"Vehículo de dos o tres ruedas con cilindrada máxima de 50 cc.", pista:"Vehículo de 50 cc"},
                {letra:"D", palabra:"DILIGENCIA", definicion:"Conjunto de cuidados que debe tener el conductor para evitar daños.", pista:"Cuidado exigible al conductor"},
                {letra:"E", palabra:"ESTRIBO", definicion:"Elemento lateral del vehículo para subir o bajar del mismo.", pista:"Peldaño lateral del coche"},
                {letra:"F", palabra:"FISCALIZACIÓN", definicion:"Control que realiza la DGT sobre las infracciones de tráfico.", pista:"Control de la DGT"},
                {letra:"G", palabra:"GUARDARRAÍL", definicion:"Barrera metálica lateral de seguridad en autopistas y autovías.", pista:"Barrera de seguridad"},
                {letra:"H", palabra:"HOMOLOGACIÓN", definicion:"Certificación oficial que acredita que un vehículo cumple la normativa.", pista:"Certificado oficial del vehículo"},
                {letra:"I", palabra:"IMPRUDENTE", definicion:"Conductor que actúa con temeridad al volante.", pista:"Conductor temerario"},
                {letra:"J", palabra:"JUDICIAL", definicion:"Vía por la que se pueden recurrir sanciones graves de tráfico.", pista:"Vía de recurso grave"},
                {letra:"K", palabra:"KILOMÉTRICO", definicion:"Relativo al kilometraje o distancia recorrida por un vehículo.", pista:"Relativo al kilometraje"},
                {letra:"L", palabra:"LUMINISCENTE", definicion:"Material que brilla en la oscuridad usado en señalización.", pista:"Material que brilla"},
                {letra:"M", palabra:"MANIOBRA", definicion:"Cualquier movimiento del vehículo que modifica su posición en la vía.", pista:"Movimiento del vehículo"},
                {letra:"N", palabra:"NEUMÁTICO", definicion:"Pieza de caucho que garantiza el agarre del vehículo al asfalto.", pista:"Rueda del vehículo"},
                {letra:"Ñ", palabra:"PIRAÑA", definicion:"Contiene la Ñ: coloquial para conductor que no respeta las normas.", pista:"Conductor agresivo (coloquial)"},
                {letra:"O", palabra:"OMISIÓN", definicion:"No realizar una acción debida, como socorrer en un accidente.", pista:"No hacer lo que se debe"},
                {letra:"P", palabra:"PRUDENCIA", definicion:"Cuidado y moderación que debe tener todo conductor.", pista:"Cuidado al conducir"},
                {letra:"Q", palabra:"QUÓRUM", definicion:"Contiene la Q: número mínimo de miembros para tomar decisiones en un órgano.", pista:"Mínimo de asistentes"},
                {letra:"R", palabra:"RECURSO", definicion:"Medio legal para impugnar una sanción de tráfico.", pista:"Impugnar una multa"},
                {letra:"S", palabra:"SANCIONADOR", definicion:"Relativo a la imposición de sanciones por infracciones.", pista:"Relativo a las multas"},
                {letra:"T", palabra:"TRAMITACIÓN", definicion:"Proceso administrativo de una denuncia o expediente de tráfico.", pista:"Proceso administrativo"},
                {letra:"U", palabra:"UNIPERSONAL", definicion:"Contiene la U: relativo a un solo ocupante en el vehículo.", pista:"Un solo ocupante"},
                {letra:"V", palabra:"VIGILANCIA", definicion:"Labor de control que realizan los agentes de tráfico en la vía.", pista:"Control policial de tráfico"},
                {letra:"W", palabra:"WARNING", definicion:"Contiene la W: luces de emergencia obligatorias al averiarse el coche.", pista:"Luces de emergencia"},
                {letra:"X", palabra:"XENOFOBIA", definicion:"Contiene la X: actitud discriminatoria también sancionable en la vía.", pista:"Discriminación"},
                {letra:"Y", palabra:"YACIJA", definicion:"Contiene la Y: vehículo o elemento tendido en la vía sin movimiento.", pista:"Vehículo tendido en la vía"},
                {letra:"Z", palabra:"ZIGZAG", definicion:"Contiene la Z: maniobra peligrosa y prohibida en la conducción.", pista:"Maniobra en zigzag"}
            ]
        }
    };

    /* ============================================================
       ESTADO
       ============================================================ */
    let estado = {
        nivelActual: null,
        preguntas: [],
        indice: 0,
        aciertos: 0,
        fallos: 0,
        tiempoRestante: 0,
        tiempoTotal: 0,
        intervalo: null,
        fase: "menu",
        respuestas: []
    };

    /* ============================================================
       UTILIDADES
       ============================================================ */
    function mezclar(arr){
        const a = [...arr];
        for(let i = a.length - 1; i > 0; i--){
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function normalizar(s){
        return String(s).trim().toUpperCase()
            .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
            .replace(/\s+/g,"");
    }

    function escapeHtml(s){
        return String(s).replace(/[&<>"']/g,c=>({
            "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
        }[c]));
    }

    function formatearTiempo(seg){
        const m = Math.floor(seg / 60);
        const s = seg % 60;
        return m + ":" + String(s).padStart(2,"0");
    }

    /* ============================================================
       NAVEGACIÓN
       ============================================================ */
    function irAMenu(){
        clearInterval(estado.intervalo);
        estado.fase = "menu";
        render();
    }

    function iniciarNivel(clave){
        const nivel = NIVELES[clave];
        if(!nivel) return;

        estado = {
            nivelActual: clave,
            preguntas: mezclar(nivel.rosco).map(p => ({...p, estado: undefined})),
            indice: 0,
            aciertos: 0,
            fallos: 0,
            tiempoRestante: nivel.tiempo,
            tiempoTotal: nivel.tiempo,
            intervalo: null,
            fase: "jugando",
            respuestas: []
        };
        render();
        iniciarTimer();
    }

    function iniciarTimer(){
        clearInterval(estado.intervalo);
        estado.intervalo = setInterval(() => {
            estado.tiempoRestante--;
            if(estado.tiempoRestante <= 0){
                estado.tiempoRestante = 0;
                clearInterval(estado.intervalo);
                finalizar();
                return;
            }
            actualizarTimer();
            actualizarScoreTimer();
        }, 1000);
    }

    function actualizarTimer(){
        const c = document.getElementById("timerCircle");
        const n = document.getElementById("timerNumber");
        if(!c || !n) return;
        const pct = estado.tiempoRestante / estado.tiempoTotal;
        const grados = pct * 360;
        const color = estado.tiempoRestante <= 15 ? "#ef4444" : "#fbbf24";
        c.style.background = `conic-gradient(${color} ${grados}deg, #e2e8f0 0)`;
        c.classList.toggle("alert", estado.tiempoRestante <= 15);
        n.textContent = formatearTiempo(estado.tiempoRestante);
    }

    function actualizarScoreTimer(){
        const t = document.getElementById("tiempoScore");
        if(!t) return;
        t.textContent = formatearTiempo(estado.tiempoRestante);
        t.classList.toggle("alerta", estado.tiempoRestante <= 15);
    }

    /* ============================================================
       RENDER
       ============================================================ */
    function render(){
        const app = document.getElementById("app");

        if(estado.fase === "menu"){ app.innerHTML = renderMenu(); return; }
        if(estado.fase === "final"){ app.innerHTML = renderFinal(); return; }
        app.innerHTML = renderJuego();
        dibujarRosco();
        actualizarTimer();
        actualizarScoreTimer();
        bindEventos();
    }

    /* ============================================================
       MENÚ DE NIVELES
       ============================================================ */
    function renderMenu(){
        const tarjetas = Object.entries(NIVELES).map(([clave, n]) => `
            <div class="nivel-card ${n.clase}" onclick="seleccionarNivel('${clave}')">
                <span class="nivel-emoji">${n.emoji}</span>
                <h3>${n.nombre}</h3>
                <div class="desc">${n.desc}</div>
                <div class="stats">
                    <span><i class="fas fa-circle-notch"></i> 25 letras</span>
                    <span><i class="fas fa-clock"></i> ${formatearTiempo(n.tiempo)}</span>
                </div>
            </div>
        `).join("");

        return `
            <div class="niveles-grid">${tarjetas}</div>
            <a href="index.html" class="btn-reiniciar" style="text-decoration:none; display:flex;">
                <i class="fas fa-arrow-left"></i> Volver al menú de Mini Retos
            </a>
        `;
    }

    /* ============================================================
       JUEGO
       ============================================================ */
    function renderJuego(){
        const nivel = NIVELES[estado.nivelActual];
        const p = estado.preguntas[estado.indice];

        return `
            <div class="nivel-badge-wrap">
                <span class="nivel-badge ${nivel.clase}">
                    ${nivel.emoji} Nivel ${nivel.nombre}
                </span>
            </div>

            <div class="score-board">
                <div class="score-item">
                    <div class="score-value aciertos" id="aciertosScore">${estado.aciertos}</div>
                    <div class="score-label">✅ Aciertos</div>
                </div>
                <div class="score-item">
                    <div class="score-value pendientes" id="pendientesScore">${contarPendientes()}</div>
                    <div class="score-label">⏳ Pendientes</div>
                </div>
                <div class="score-item">
                    <div class="score-value fallos" id="fallosScore">${estado.fallos}</div>
                    <div class="score-label">❌ Fallos</div>
                </div>
                <div class="score-item">
                    <div class="score-value timer-num" id="tiempoScore">${formatearTiempo(estado.tiempoRestante)}</div>
                    <div class="score-label">⏱️ Tiempo</div>
                </div>
            </div>

            <div class="timer-wrap">
                <div class="timer-circle" id="timerCircle">
                    <span class="timer-number" id="timerNumber">${formatearTiempo(estado.tiempoRestante)}</span>
                </div>
            </div>

            <div class="rosco-wrap">
                <div class="rosco" id="rosco"></div>
            </div>

            <div class="pregunta-card">
                <div class="letra-actual">${p.letra}</div>
                <div class="definicion">${escapeHtml(p.definicion)}</div>
                <div class="pista">💡 ${escapeHtml(p.pista)}</div>
            </div>

            <div class="respuesta-form">
                <input id="respuestaInput" type="text" placeholder="Escribe tu respuesta..." autocomplete="off" autofocus>
                <button class="btn-responder" id="responderBtn"><i class="fas fa-check"></i> Responder</button>
                <button class="btn-pasar" id="pasarBtn"><i class="fas fa-forward"></i> Pasar</button>
            </div>

            <div class="feedback" id="feedback"></div>
        `;
    }

    function dibujarRosco(){
        const rosco = document.getElementById("rosco");
        if(!rosco) return;

        const n = estado.preguntas.length;
        const radius = 42;
        let html = "";

        estado.preguntas.forEach((p, i) => {
            const angulo = (i / n) * 2 * Math.PI - Math.PI / 2;
            const x = 50 + radius * Math.cos(angulo);
            const y = 50 + radius * Math.sin(angulo);

            let clase = "letra";
            if(i === estado.indice) clase += " actual";
            else if(p.estado === "acierto") clase += " acierto";
            else if(p.estado === "fallo") clase += " fallo";
            else if(p.estado === "pendiente") clase += " pendiente";

            html += `<div class="${clase}" style="left:${x}%;top:${y}%">${p.letra}</div>`;
        });

        rosco.innerHTML = html;
    }

    function contarPendientes(){
        return estado.preguntas.filter(p => !p.estado).length;
    }

    /* ============================================================
       EVENTOS DEL JUEGO
       ============================================================ */
    function bindEventos(){
        const input = document.getElementById("respuestaInput");
        const responderBtn = document.getElementById("responderBtn");
        const pasarBtn = document.getElementById("pasarBtn");
        const feedback = document.getElementById("feedback");

        if(input){
            input.focus();
            input.addEventListener("keydown", e => { if(e.key === "Enter") responder(); });
        }
        if(responderBtn) responderBtn.addEventListener("click", responder);
        if(pasarBtn) pasarBtn.addEventListener("click", pasar);

        function responder(){
            if(estado.fase !== "jugando") return;
            const valor = input.value.trim();
            if(!valor){
                feedback.textContent = "Escribe algo o pulsa Pasar";
                feedback.className = "feedback err";
                return;
            }

            const p = estado.preguntas[estado.indice];
            const correcto = normalizar(valor) === normalizar(p.palabra);

            if(correcto){
                p.estado = "acierto";
                estado.aciertos++;
                feedback.textContent = "✅ ¡Correcto!";
                feedback.className = "feedback ok";
            } else {
                p.estado = "fallo";
                estado.fallos++;
                feedback.textContent = "❌ Era: " + p.palabra;
                feedback.className = "feedback err";
            }

            estado.respuestas.push({
                letra: p.letra, palabra: p.palabra,
                respuesta: valor, ok: correcto
            });

            setTimeout(siguiente, 700);
        }

        function pasar(){
            if(estado.fase !== "jugando") return;
            const p = estado.preguntas[estado.indice];
            if(!p.estado) p.estado = "pendiente";
            siguiente();
        }
    }

    function siguiente(){
        let intentos = 0;
        let i = estado.indice;
        do {
            i = (i + 1) % estado.preguntas.length;
            intentos++;
            if(intentos > estado.preguntas.length * 2) break;
        } while(estado.preguntas[i].estado === "acierto" || estado.preguntas[i].estado === "fallo");

        estado.indice = i;

        const sinResolver = estado.preguntas.filter(p => p.estado !== "acierto" && p.estado !== "fallo");
        if(sinResolver.length === 0){ finalizar(); return; }

        const activos = estado.preguntas.filter(p => !p.estado);
        const pendientes = estado.preguntas.filter(p => p.estado === "pendiente");
        if(activos.length === 0 && pendientes.length > 0){
            estado.preguntas.forEach(p => { if(p.estado === "pendiente") p.estado = undefined; });
            estado.indice = estado.preguntas.findIndex(p => !p.estado);
        }

        render();
    }

    function finalizar(){
        clearInterval(estado.intervalo);
        estado.fase = "final";

        // Guardar en localStorage (mismo formato que los otros minijuegos)
        const puntosFinales = estado.aciertos * 10;
        const stats = JSON.parse(localStorage.getItem('aprobadoya_minijuegos') || '{}');
        const nuevoRegistro = {
            id: Date.now(),
            juego: "Pasapalabra DGT",
            puntuacion: puntosFinales,
            fecha: new Date().toLocaleString(),
            aciertos: estado.aciertos,
            total: estado.preguntas.length,
            racha: estado.aciertos,
            nivel: NIVELES[estado.nivelActual].nombre
        };
        const historialActual = stats.historial || [];
        stats.historial = [nuevoRegistro, ...historialActual].slice(0, 20);
        stats.totalJuegos = (stats.totalJuegos || 0) + 1;
        stats.totalPuntos = (stats.totalPuntos || 0) + puntosFinales;
        stats.mejorRacha = Math.max(stats.mejorRacha || 0, estado.aciertos);
        localStorage.setItem('aprobadoya_minijuegos', JSON.stringify(stats));

        render();
    }

    /* ============================================================
       PANTALLA FINAL
       ============================================================ */
    function renderFinal(){
        const nivel = NIVELES[estado.nivelActual];
        const total = estado.aciertos + estado.fallos;
        const pct = total > 0 ? Math.round((estado.aciertos / total) * 100) : 0;

        let titulo, emoji;
        if(pct === 100){titulo = "¡PERFECTO!";emoji = "🏆";}
        else if(pct >= 80){titulo = "¡EXCELENTE!";emoji = "🌟";}
        else if(pct >= 60){titulo = "¡BIEN HECHO!";emoji = "👍";}
        else if(pct >= 40){titulo = "PUEDES MEJORAR";emoji = "💪";}
        else{titulo = "SIGUE PRACTICANDO";emoji = "📚";}

        const siguienteNivel = pct >= 80 && estado.nivelActual === "facil" ? "medio"
                            : pct >= 80 && estado.nivelActual === "medio" ? "dificil"
                            : null;

        return `
            <div class="mensaje-victoria">
                <span class="nivel-badge ${nivel.clase}" style="margin-bottom:12px">
                    ${nivel.emoji} Nivel ${nivel.nombre}
                </span>
                <div style="font-size:3rem">${emoji}</div>
                <h2>${titulo}</h2>
                <div class="puntos-finales">${estado.aciertos}</div>
                <p>aciertos de ${estado.preguntas.length} palabras</p>

                <div class="repaso">
                    ${estado.respuestas.map(r => `
                        <div class="fila">
                            <div>
                                <b>${r.letra}</b>
                                <span style="color:#475569;margin-left:10px">${escapeHtml(r.palabra)}</span>
                            </div>
                            <div style="color:${r.ok === true ? "#16a34a" : r.ok === false ? "#dc2626" : "#94a3b8"};font-weight:700">
                                ${r.ok === true ? "✅" : r.ok === false ? "❌" : "—"}
                            </div>
                        </div>
                    `).join("")}
                </div>

                <div class="acciones-finales">
                    <button class="btn-verde" onclick="repetirNivel()">
                        <i class="fas fa-redo"></i> Repetir nivel
                    </button>
                    ${siguienteNivel ? `
                        <button onclick="seleccionarNivel('${siguienteNivel}')">
                            <i class="fas fa-arrow-up"></i> Pasar a ${NIVELES[siguienteNivel].nombre}
                        </button>
                    ` : `
                        <button onclick="irAMenu()">
                            <i class="fas fa-list"></i> Elegir nivel
                        </button>
                    `}
                    <a href="index.html" class="btn-secundario">
                        <i class="fas fa-home"></i> Menú principal
                    </a>
                </div>
            </div>
        `;
    }

    /* ============================================================
       ZONA DE USUARIO (igual que en memoria)
       ============================================================ */
    function renderUserZone() {
        const userZone = document.getElementById('userZone');
        if (!userZone) return;
        const user = auth.currentUser;
        if (user) {
            userZone.innerHTML = `<div class="user-menu"><div class="user-avatar">🚗</div><span class="user-name">${user.email.split('@')[0]}</span><a href="../perfil/index.html" class="btn-profile">Mi perfil</a><button id="logoutBtn" class="btn-logout">Cerrar sesión</button></div>`;
            document.getElementById('logoutBtn')?.addEventListener('click', async () => { await signOut(auth); window.location.href = '../index.html'; });
        } else {
            userZone.innerHTML = `<a href="../login.html" class="btn-login"><i class="fas fa-sign-in-alt"></i> Iniciar sesión</a>`;
        }
    }

    /* ============================================================
       EXPONER FUNCIONES GLOBALES
       ============================================================ */
    window.seleccionarNivel = iniciarNivel;
    window.repetirNivel = () => iniciarNivel(estado.nivelActual);
    window.irAMenu = irAMenu;

    /* ============================================================
       ARRANQUE
       ============================================================ */
    onAuthStateChanged(auth, (user) => {
        renderUserZone();
        if (!user) {
            window.location.href = '../login.html';
        } else {
            currentUserId = user.uid;
            render();
        }
    });

    document.getElementById('menuMobileBtn')?.addEventListener('click', () => {
        document.querySelector('.nav-wrapper')?.classList.toggle('active');
    });
</script>
</body>
