<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Carrera Multijugador DGT | AprobadoYa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #f1f5f9;
            min-height: 100vh;
        }
        
        .game-header {
            background: linear-gradient(135deg, #1a472a 0%, #0f2a1a 100%);
            color: white;
            padding: 30px 0;
            text-align: center;
        }
        .game-header h1 { font-size: 2rem; margin-bottom: 10px; }
        .game-header h1 i { color: #fbbf24; }
        
        .game-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
        }
        
        .race-track {
            background: linear-gradient(135deg, #2d3e2c, #1f2e1a);
            border-radius: 30px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .track {
            position: relative;
            height: 100px;
            background: #4a5b3e;
            border-radius: 50px;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .track:last-child { margin-bottom: 0; }
        .track-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, rgba(255,255,255,0.3) 0px, rgba(255,255,255,0.3) 30px, transparent 30px, transparent 60px);
        }
        .car {
            position: absolute;
            bottom: 10px;
            left: 0%;
            font-size: 2.5rem;
            transition: left 0.4s ease-out;
            filter: drop-shadow(2px 4px 8px rgba(0,0,0,0.3));
            z-index: 10;
        }
        .finish-line {
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            width: 35px;
            background: repeating-linear-gradient(90deg, #000 0px, #000 12px, #fff 12px, #fff 24px);
        }
        .player-name {
            position: absolute;
            top: -28px;
            left: 15px;
            font-size: 0.75rem;
            background: rgba(0,0,0,0.7);
            padding: 4px 12px;
            border-radius: 20px;
            white-space: nowrap;
        }
        
        .score-board {
            display: flex;
            justify-content: space-between;
            background: white;
            border-radius: 25px;
            padding: 20px 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
        }
        .score-item {
            text-align: center;
            flex: 1;
        }
        .score-value {
            font-size: 2rem;
            font-weight: 800;
            color: #fbbf24;
        }
        .score-label {
            font-size: 0.75rem;
            color: #64748b;
            margin-top: 5px;
        }
        
        .question-card {
            background: white;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 25px;
            color: #1e293b;
            line-height: 1.5;
        }
        .options {
            display: grid;
            gap: 12px;
        }
        .option-btn {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 20px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
        }
        .option-btn:hover:not(.disabled) {
            background: #fef3c7;
            border-color: #fbbf24;
            transform: translateX(8px);
        }
        .option-prefix {
            font-weight: 800;
            color: #fbbf24;
            width: 35px;
        }
        .disabled { opacity: 0.6; cursor: not-allowed; }
        .correct { background: #d1fae5; border-color: #10b981; }
        .incorrect { background: #fee2e2; border-color: #ef4444; }
        
        .turn-indicator {
            text-align: center;
            padding: 12px;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a472a;
            border-radius: 50px;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .timer-bar {
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 20px;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            width: 100%;
            transition: width 0.1s linear;
        }
        
        .feedback-message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-weight: 500;
            animation: fadeIn 0.3s ease;
        }
        .feedback-correct { background: #d1fae5; color: #065f46; border-left: 4px solid #10b981; }
        .feedback-incorrect { background: #fee2e2; color: #991b1b; border-left: 4px solid #ef4444; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .countdown-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 2000;
        }
        .countdown-number {
            font-size: 8rem;
            font-weight: 800;
            color: #fbbf24;
            animation: bounce 0.5s ease;
        }
        @keyframes bounce {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .resultado-final {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 25px;
        }
        .btn-reintentar {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a472a;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn-reintentar:hover { transform: scale(1.05); }
        
        @media (max-width: 768px) {
            .game-container { padding: 15px; }
            .score-board { flex-direction: column; gap: 10px; text-align: center; }
            .question-text { font-size: 1rem; }
            .option-btn { font-size: 0.9rem; padding: 12px 15px; }
            .car { font-size: 2rem; bottom: 8px; }
            .track { height: 80px; }
            .player-name { font-size: 0.65rem; top: -22px; }
        }
    </style>
</head>
<body>
    <header style="background: #1a472a; padding: 15px 0;">
        <div style="max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
            <div style="display: flex; align-items: center; gap: 10px; color: white; font-size: 1.5rem; font-weight: 700;">
                <i class="fas fa-check-circle" style="color: #fbbf24;"></i>
                <span>Aprobado<span style="color: #fbbf24;">Ya</span></span>
            </div>
            <a href="lobby.html" style="color: #fbbf24; text-decoration: none; padding: 8px 20px; border: 2px solid #fbbf24; border-radius: 50px; font-weight: 600;">
                <i class="fas fa-arrow-left"></i> Salir
            </a>
        </div>
    </header>

    <div class="game-header">
        <div class="container" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
            <h1><i class="fas fa-flag-checkered"></i> Carrera Multijugador DGT</h1>
            <p>Responde preguntas del examen oficial y adelanta a tu rival</p>
        </div>
    </div>

    <div class="game-container" id="gameContainer">
        <div style="text-align:center; padding:80px;">
            <div style="width:60px; height:60px; border:4px solid rgba(0,0,0,0.1); border-top-color:#fbbf24; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 25px;"></div>
            <p>Cargando partida...</p>
        </div>
    </div>

    <style>@keyframes spin { to { transform: rotate(360deg); } }</style>

    <script type="module">
        // ============================================
        // IMPORTAR PREGUNTAS
        // ============================================
        import { preguntasMulti } from './preguntas-multi.js';

        const TOTAL_PREGUNTAS = 10;
        const TIEMPO_RESPUESTA = 15000;
        
        let salaId = null;
        let salaData = null;
        let esJugador1 = true;
        let gameActivo = true;
        let timerInterval = null;
        let yaRespondi = false;
        let checkInterval = null;
        
        function log(msg) { console.log(`[${new Date().toLocaleTimeString()}] ${msg}`); }
        
        function seleccionarPreguntas() {
            const mezcladas = [...preguntasMulti];
            for (let i = mezcladas.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [mezcladas[i], mezcladas[j]] = [mezcladas[j], mezcladas[i]];
            }
            return mezcladas.slice(0, TOTAL_PREGUNTAS);
        }
        
        function iniciarTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const timerFill = document.getElementById('timerFill');
            if (!timerFill) return;
            const startTime = Date.now();
            timerInterval = setInterval(() => {
                if (!gameActivo) return;
                const elapsed = Date.now() - startTime;
                const remaining = Math.max(0, TIEMPO_RESPUESTA - elapsed);
                const percent = (remaining / TIEMPO_RESPUESTA) * 100;
                if (timerFill) timerFill.style.width = `${percent}%`;
                if (remaining <= 0 && !yaRespondi && gameActivo) {
                    clearInterval(timerInterval);
                    manejarTimeout();
                }
            }, 100);
        }
        
        async function manejarTimeout() {
            if (!gameActivo || yaRespondi || !salaData) return;
            const turnoActual = salaData.turno;
            const esMiTurno = (turnoActual === (esJugador1 ? 0 : 1));
            if (!esMiTurno) return;
            yaRespondi = true;
            
            const feedback = document.createElement('div');
            feedback.className = 'feedback-message feedback-incorrect';
            feedback.innerHTML = '<i class="fas fa-clock"></i> ⏰ ¡TIEMPO AGOTADO! No respondiste a tiempo';
            document.querySelector('.question-card')?.appendChild(feedback);
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('disabled'));
            
            // Actualizar turno
            salaData.turno = turnoActual + 1;
            guardarPartida();
            
            if (salaData.turno >= TOTAL_PREGUNTAS) {
                setTimeout(() => finalizarJuego(), 2000);
            } else {
                setTimeout(() => renderizarJuego(), 2000);
            }
        }
        
        function guardarPartida() {
            if (salaId) {
                localStorage.setItem(`partida_${salaId}`, JSON.stringify(salaData));
            }
        }
        
        function mostrarCuentaAtras() {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'countdown-overlay';
                overlay.innerHTML = `<div class="countdown-number" id="countdownNum">3</div><div style="color:white;font-size:1.5rem;">Preparados...</div>`;
                document.body.appendChild(overlay);
                let count = 3;
                const interval = setInterval(() => {
                    count--;
                    if (count >= 1) {
                        const num = document.getElementById('countdownNum');
                        if (num) num.textContent = count;
                    } else {
                        clearInterval(interval);
                        overlay.remove();
                        resolve();
                    }
                }, 1000);
            });
        }
        
        function responder(respuesta) {
            if (!gameActivo || yaRespondi || !salaData) return;
            const turnoActual = salaData.turno;
            const esMiTurno = (turnoActual === (esJugador1 ? 0 : 1));
            if (!esMiTurno) return;
            
            yaRespondi = true;
            if (timerInterval) clearInterval(timerInterval);
            
            const pregunta = salaData.preguntas[turnoActual];
            const esCorrecto = (respuesta === pregunta.correcta);
            
            const opciones = document.querySelectorAll('.option-btn');
            opciones.forEach((btn, idx) => {
                btn.classList.add('disabled');
                if (idx === pregunta.correcta) btn.classList.add('correct');
                if (idx === respuesta && respuesta !== pregunta.correcta) btn.classList.add('incorrect');
            });
            
            const feedback = document.createElement('div');
            if (esCorrecto) {
                feedback.className = 'feedback-message feedback-correct';
                feedback.innerHTML = '<i class="fas fa-check-circle"></i> ✓ ¡CORRECTO! +1 punto';
                if (esJugador1) salaData.puntuacion1 += 1;
                else salaData.puntuacion2 += 1;
            } else {
                feedback.className = 'feedback-message feedback-incorrect';
                feedback.innerHTML = `<i class="fas fa-times-circle"></i> ✗ INCORRECTO. La respuesta correcta era: ${pregunta.opciones[pregunta.correcta]}`;
            }
            document.querySelector('.question-card')?.appendChild(feedback);
            
            salaData.turno = turnoActual + 1;
            guardarPartida();
            
            if (salaData.turno >= TOTAL_PREGUNTAS) {
                setTimeout(() => finalizarJuego(), 2000);
            } else {
                setTimeout(() => renderizarJuego(), 2000);
            }
        }
        
        function renderizarJuego() {
            if (!salaData || !salaData.preguntas) {
                document.getElementById('gameContainer').innerHTML = '<p>Cargando partida...</p>';
                return;
            }
            
            const p1 = salaData.puntuacion1 || 0;
            const p2 = salaData.puntuacion2 || 0;
            const turno = salaData.turno || 0;
            
            if (turno >= TOTAL_PREGUNTAS) {
                finalizarJuego();
                return;
            }
            
            const pregunta = salaData.preguntas[turno];
            if (!pregunta) {
                document.getElementById('gameContainer').innerHTML = '<p>Error: Pregunta no encontrada</p>';
                return;
            }
            
            const esMiTurno = (turno === (esJugador1 ? 0 : 1));
            const avance1 = (p1 / TOTAL_PREGUNTAS) * 100;
            const avance2 = (p2 / TOTAL_PREGUNTAS) * 100;
            const nombre1 = salaData.jugador1?.nombre || 'Jugador 1';
            const nombre2 = salaData.jugador2?.nombre || 'Jugador 2';
            const coche1 = salaData.jugador1?.coche || '🏎️';
            const coche2 = salaData.jugador2?.coche || '🚗';
            
            document.getElementById('gameContainer').innerHTML = `
                <div class="race-track">
                    <div class="track">
                        <div class="track-lines"></div>
                        <div class="player-name">${coche1} ${escapeHtml(nombre1)}</div>
                        <div class="car" style="left: ${Math.min(avance1, 96)}%">${coche1}</div>
                        <div class="finish-line"></div>
                    </div>
                    <div class="track">
                        <div class="track-lines"></div>
                        <div class="player-name">${coche2} ${escapeHtml(nombre2)}</div>
                        <div class="car" style="left: ${Math.min(avance2, 96)}%">${coche2}</div>
                        <div class="finish-line"></div>
                    </div>
                </div>
                <div class="score-board">
                    <div class="score-item"><div class="score-value">${p1}</div><div class="score-label">${escapeHtml(nombre1)}</div></div>
                    <div class="score-item"><div class="score-value">${turno+1}/${TOTAL_PREGUNTAS}</div><div class="score-label">Pregunta</div></div>
                    <div class="score-item"><div class="score-value">${p2}</div><div class="score-label">${escapeHtml(nombre2)}</div></div>
                </div>
                ${!esMiTurno ? 
                    '<div class="turn-indicator"><i class="fas fa-hourglass-half"></i> ⏳ Esperando respuesta del rival...</div>' : 
                    '<div class="turn-indicator"><i class="fas fa-clock"></i> 🎯 ¡TU TURNO! Responde antes de 15 segundos<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div></div>'
                }
                <div class="question-card">
                    <div class="question-text">${escapeHtml(pregunta.texto)}</div>
                    <div class="options" id="options">
                        ${pregunta.opciones.map((opt, idx) => `
                            <div class="option-btn" data-opcion="${idx}">
                                <span class="option-prefix">${String.fromCharCode(65+idx)}.</span>
                                <span>${escapeHtml(opt)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            yaRespondi = false;
            if (esMiTurno && gameActivo) {
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.addEventListener('click', () => responder(parseInt(btn.dataset.opcion)));
                });
                iniciarTimer();
            } else {
                document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('disabled'));
            }
        }
        
        function finalizarJuego() {
            gameActivo = false;
            if (timerInterval) clearInterval(timerInterval);
            if (checkInterval) clearInterval(checkInterval);
            
            const p1 = salaData?.puntuacion1 || 0;
            const p2 = salaData?.puntuacion2 || 0;
            const nombre1 = salaData?.jugador1?.nombre || 'Jugador 1';
            const nombre2 = salaData?.jugador2?.nombre || 'Jugador 2';
            
            let ganador = "Empate";
            let esGanador = false;
            if (p1 > p2) {
                ganador = nombre1;
                esGanador = esJugador1;
            } else if (p2 > p1) {
                ganador = nombre2;
                esGanador = !esJugador1;
            }
            
            document.getElementById('gameContainer').innerHTML = `
                <div class="resultado-final">
                    <i class="fas ${esGanador ? 'fa-trophy' : 'fa-flag-checkered'}" style="font-size: 4rem; color: #fbbf24;"></i>
                    <h2 style="margin: 20px 0;">🏁 ¡PARTIDA FINALIZADA! 🏁</h2>
                    <div style="background: #f8fafc; padding: 20px; border-radius: 20px; margin: 20px 0;">
                        <p><strong>${escapeHtml(nombre1)}</strong>: ${p1} puntos</p>
                        <p><strong>${escapeHtml(nombre2)}</strong>: ${p2} puntos</p>
                        <div style="height: 1px; background: #e2e8f0; margin: 15px 0;"></div>
                        <h3 style="color: #fbbf24;">${ganador === "Empate" ? "🤝 ¡EMPATE! 🤝" : (esGanador ? "🎉 ¡HAS GANADO! 🎉" : `🏆 GANÓ ${escapeHtml(ganador)} 🏆`)}</h3>
                    </div>
                    <button class="btn-reintentar" onclick="window.location.href='lobby.html'"><i class="fas fa-redo"></i> Jugar de nuevo</button>
                    <a href="lobby.html" style="display: inline-block; margin-left: 15px; background: #f1f5f9; color: #1e293b; padding: 12px 30px; border-radius: 50px; text-decoration: none;"><i class="fas fa-arrow-left"></i> Volver al lobby</a>
                </div>
            `;
            
            // Limpiar partida
            if (salaId) {
                localStorage.removeItem(`partida_${salaId}`);
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        function cargarPartida() {
            const urlParams = new URLSearchParams(window.location.search);
            salaId = urlParams.get('sala');
            
            if (!salaId) {
                window.location.href = 'lobby.html';
                return;
            }
            
            const key = `partida_${salaId}`;
            const data = localStorage.getItem(key);
            
            if (!data) {
                alert('Partida no encontrada');
                window.location.href = 'lobby.html';
                return;
            }
            
            salaData = JSON.parse(data);
            
            // Determinar si soy jugador 1 o 2
            const partidaActual = localStorage.getItem('partida_actual');
            if (partidaActual === salaId) {
                // Soy el creador (jugador 1) o el que se unió?
                // Por simplicidad, el primer jugador es el 1
                esJugador1 = true;
            } else {
                esJugador1 = false;
            }
            
            // Inicializar preguntas si no existen
            if (!salaData.preguntas) {
                salaData.preguntas = seleccionarPreguntas();
                salaData.turno = 0;
                salaData.puntuacion1 = 0;
                salaData.puntuacion2 = 0;
                guardarPartida();
            }
            
            // Iniciar juego
            mostrarCuentaAtras().then(() => {
                renderizarJuego();
                // Iniciar verificación de cambios
                if (checkInterval) clearInterval(checkInterval);
                checkInterval = setInterval(() => {
                    const updated = localStorage.getItem(key);
                    if (updated) {
                        const newData = JSON.parse(updated);
                        if (newData.turno !== salaData.turno) {
                            salaData = newData;
                            renderizarJuego();
                        }
                    }
                }, 1000);
            });
        }
        
        // ============================================
        // INICIAR
        // ============================================
        cargarPartida();
        
        // Limpiar al cerrar
        window.addEventListener('beforeunload', () => {
            if (checkInterval) clearInterval(checkInterval);
            if (timerInterval) clearInterval(timerInterval);
        });
    </script>
</body>
</html>
