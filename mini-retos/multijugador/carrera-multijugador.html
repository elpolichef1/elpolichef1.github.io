<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Carrera Multijugador</title>

  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      min-height: 100vh;
    }

    .contenedor {
      width: min(900px, 94%);
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
    }

    .marcador {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin: 20px 0;
    }

    .jugador {
      background: #1f2937;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
    }

    .jugador.activo {
      outline: 3px solid #22c55e;
    }

    .coche {
      font-size: 50px;
      transition: transform .3s;
    }

    .puntos {
      font-size: 30px;
      font-weight: bold;
    }

    .carrera {
      background: #374151;
      height: 70px;
      border-radius: 20px;
      margin: 20px 0;
      position: relative;
      overflow: hidden;
    }

    .meta {
      position: absolute;
      right: 0;
      top: 0;
      height: 100%;
      width: 8px;
      background: white;
    }

    .auto {
      position: absolute;
      left: 0;
      top: 5px;
      font-size: 50px;
      transition: left .5s ease;
    }

    .auto2 {
      top: 35px;
      font-size: 35px;
    }

    .pregunta {
      background: #1f2937;
      padding: 25px;
      border-radius: 20px;
      margin-top: 20px;
    }

    .pregunta h2 {
      line-height: 1.4;
    }

    .opciones {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .opcion {
      border: 0;
      background: #4b5563;
      color: white;
      padding: 16px;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
      text-align: left;
    }

    .opcion:hover:not(:disabled) {
      background: #2563eb;
    }

    .opcion:disabled {
      cursor: not-allowed;
      opacity: .7;
    }

    .correcta {
      background: #15803d !important;
    }

    .incorrecta {
      background: #b91c1c !important;
    }

    .temporizador {
      font-size: 28px;
      text-align: center;
      font-weight: bold;
      margin: 15px;
    }

    .turno {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      margin: 15px;
    }

    .estado {
      text-align: center;
      padding: 15px;
      background: #1f2937;
      border-radius: 10px;
      margin: 15px 0;
    }

    .pantalla-final {
      position: fixed;
      inset: 0;
      background: #111827ee;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    .final-box {
      width: min(500px, 90%);
      background: #1f2937;
      padding: 35px;
      border-radius: 20px;
      text-align: center;
    }

    .final-box h1 {
      font-size: 40px;
    }

    .final-box button {
      width: 100%;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      cursor: pointer;
    }

    .oculto {
      display: none !important;
    }

  </style>

</head>

<body>

<div class="contenedor">

  <header>
    <h1>🏁 Carrera Multijugador DGT</h1>
    <p id="codigoSala"></p>
  </header>


  <!-- MARCADOR -->

  <div class="marcador">

    <div id="jugador1" class="jugador">

      <div id="nombre1">
        Tú
      </div>

      <div id="coche1" class="coche">
        🏎️
      </div>

      <div id="puntos1" class="puntos">
        0
      </div>

    </div>


    <div id="jugador2" class="jugador">

      <div>
        Rival
      </div>

      <div id="coche2" class="coche">
        🚗
      </div>

      <div id="puntos2" class="puntos">
        0
      </div>

    </div>

  </div>


  <!-- CARRERA -->

  <div class="carrera">

    <div id="meta" class="meta"></div>

    <div id="auto1" class="auto">
      🏎️
    </div>

    <div id="auto2" class="auto auto2">
      🚗
    </div>

  </div>


  <div id="estado" class="estado">
    Conectando...
  </div>


  <div id="turno" class="turno"></div>

  <div id="temporizador" class="temporizador"></div>


  <!-- PREGUNTA -->

  <div id="preguntaBox" class="pregunta oculto">

    <h2 id="textoPregunta"></h2>

    <div id="opciones" class="opciones"></div>

  </div>

</div>


<!-- FINAL -->

<div id="pantallaFinal" class="pantalla-final">

  <div class="final-box">

    <h1 id="resultadoFinal">
      🏁
    </h1>

    <p id="resultadoPuntos"></p>

    <button onclick="volverLobby()">
      Volver al lobby
    </button>

  </div>

</div>


<script>
"use strict";


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const TOTAL_PREGUNTAS = 10;
const TIEMPO_PREGUNTA = 15;

const PREFIX = "aprobadoya-dgt-";


/* =====================================================
   DATOS URL
===================================================== */

const params = new URLSearchParams(
  window.location.search
);

const salaCodigo = params.get("sala");
const rol = params.get("rol");

let cochePropio =
  params.get("coche") || "🏎️";


try {
  cochePropio =
    decodeURIComponent(cochePropio);
} catch {}


/* =====================================================
   VARIABLES
===================================================== */

let peer = null;
let connection = null;

let preguntas = [];

let partida = null;

let temporizador = null;

let tiempoRestante = TIEMPO_PREGUNTA;

let respondido = false;

let juegoTerminado = false;


/* =====================================================
   INICIAR
===================================================== */

window.addEventListener("load", async () => {

  if (!salaCodigo || !rol) {

    mostrarEstado(
      "Faltan datos de la partida."
    );

    return;
  }


  document.getElementById("codigoSala").textContent =
    "Sala: " + salaCodigo;


  try {

    if (rol === "host") {

      await iniciarHost();

    } else {

      await iniciarGuest();

    }

  } catch (error) {

    console.error(error);

    mostrarEstado(
      "Error iniciando la partida."
    );

  }

});


/* =====================================================
   CARGAR TEMA 1-20
===================================================== */

async function cargarPreguntas() {

  const todas = [];


  for (let i = 1; i <= 20; i++) {

    const archivo =
      "./test/data/temas/tema" +
      i +
      ".js";


    try {

      const modulo =
        await import(
          archivo + "?v=" + Date.now()
        );


      /*
       * Buscamos arrays exportados.
       */

      for (
        const valor
        of Object.values(modulo)
      ) {

        if (Array.isArray(valor)) {

          for (const pregunta of valor) {

            normalizarPregunta(
              pregunta,
              todas
            );

          }

        }


        /*
         * También soporta:
         *
         * export default {
         *   preguntas: [...]
         * }
         */

        else if (
          valor &&
          Array.isArray(valor.preguntas)
        ) {

          for (
            const pregunta
            of valor.preguntas
          ) {

            normalizarPregunta(
              pregunta,
              todas
            );

          }

        }

      }

    } catch (error) {

      console.warn(
        "No se pudo cargar:",
        archivo,
        error
      );

    }

  }


  if (todas.length === 0) {

    throw new Error(
      "No se encontraron preguntas."
    );

  }


  mezclar(todas);


  return todas.slice(
    0,
    Math.min(
      TOTAL_PREGUNTAS,
      todas.length
    )
  );

}


/* =====================================================
   NORMALIZAR PREGUNTA
===================================================== */

function normalizarPregunta(
  pregunta,
  destino
) {

  if (
    !pregunta ||
    typeof pregunta !== "object"
  ) {

    return;
  }


  const texto =
    pregunta.texto ??
    pregunta.pregunta ??
    pregunta.question;


  const opciones =
    pregunta.opciones ??
    pregunta.respuestas ??
    pregunta.answers;


  if (
    !texto ||
    !Array.isArray(opciones) ||
    opciones.length === 0
  ) {

    return;
  }


  let correcta =
    pregunta.correcta ??
    pregunta.respuestaCorrecta ??
    pregunta.correctAnswer ??
    pregunta.correct ??
    0;


  /*
   * Si la respuesta correcta viene
   * como texto en lugar de índice.
   */

  if (typeof correcta === "string") {

    const indice =
      opciones.indexOf(correcta);

    if (indice >= 0) {
      correcta = indice;
    }

  }


  correcta = Number(correcta);


  if (
    !Number.isInteger(correcta) ||
    correcta < 0 ||
    correcta >= opciones.length
  ) {

    correcta = 0;

  }


  destino.push({

    texto: String(texto),

    opciones: opciones.map(
      x => String(x)
    ),

    correcta: correcta

  });

}


/* =====================================================
   MEZCLAR ARRAY
===================================================== */

function mezclar(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() * (i + 1)
      );


    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];

  }

}


/* =====================================================
   HOST
===================================================== */

async function iniciarHost() {

  mostrarEstado(
    "Cargando preguntas..."
  );


  preguntas =
    await cargarPreguntas();


  mostrarEstado(
    "Esperando al rival..."
  );


  peer =
    new Peer(
      PREFIX + salaCodigo,
      {
        debug: 0
      }
    );


  peer.on("open", () => {

    console.log(
      "Host conectado:",
      peer.id
    );

  });


  peer.on("connection", conn => {

    connection = conn;


    connection.on("open", () => {

      console.log(
        "Rival conectado"
      );


      /*
       * Creamos la partida SOLO
       * cuando el segundo jugador
       * está conectado.
       */

      partida = {

        turno: 0,

        puntos1: 0,

        puntos2: 0,

        coche1: cochePropio,

        coche2:
          connection.metadata?.car ||
          "🚗",

        preguntas: preguntas

      };


      enviarEstado();


      pintar();


    });


    connection.on("data", mensaje => {

      procesarMensajeHost(
        mensaje
      );

    });


    connection.on("close", () => {

      if (!juegoTerminado) {

        mostrarEstado(
          "❌ El rival se ha desconectado."
        );

      }

    });


    connection.on("error", error => {

      console.error(error);

    });

  });


  peer.on("error", error => {

    console.error(
      "PeerJS:",
      error
    );


    mostrarEstado(
      "Error de conexión: " +
      error.type
    );

  });

}


/* =====================================================
   GUEST
===================================================== */

async function iniciarGuest() {

  mostrarEstado(
    "Conectando con el anfitrión..."
  );


  peer =
    new Peer({
      debug: 0
    });


  peer.on("open", () => {

    const idHost =
      PREFIX + salaCodigo;


    connection =
      peer.connect(
        idHost,
        {
          reliable: true,
          serialization: "json",
          metadata: {
            car: cochePropio
          }
        }
      );


    connection.on("open", () => {

      console.log(
        "Conectado al host"
      );


      mostrarEstado(
        "Conectado. Esperando partida..."
      );

    });


    connection.on("data", mensaje => {

      procesarMensajeGuest(
        mensaje
      );

    });


    connection.on("close", () => {

      if (!juegoTerminado) {

        mostrarEstado(
          "❌ El anfitrión se ha desconectado."
        );

      }

    });


    connection.on("error", error => {

      console.error(error);

      mostrarEstado(
        "Error de conexión."
      );

    });

  });


  peer.on("error", error => {

    console.error(error);

    mostrarEstado(
      "No se pudo conectar a la partida."
    );

  });

}


/* =====================================================
   MENSAJES DEL HOST
===================================================== */

function procesarMensajeHost(
  mensaje
) {

  if (!mensaje) {
    return;
  }


  if (
    mensaje.type === "answer"
  ) {

    /*
     * El host es el único que
     * decide si una respuesta
     * es correcta.
     */

    if (
      !partida ||
      partida.turno % 2 !== 1 ||
      respondido
    ) {

      return;

    }


    const indice =
      Number(mensaje.index);


    aplicarRespuesta(
      indice
    );

  }

}


/* =====================================================
   MENSAJES DEL GUEST
===================================================== */

function procesarMensajeGuest(
  mensaje
) {

  if (!mensaje) {
    return;
  }


  if (
    mensaje.type === "state"
  ) {

    partida =
      mensaje.partida;


    preguntas =
      partida.preguntas;


    pintar();

  }

}


/* =====================================================
   ENVIAR ESTADO
===================================================== */

function enviarEstado() {

  if (
    !connection ||
    connection.open !== true
  ) {

    return;

  }


  connection.send({

    type: "state",

    partida: partida

  });

}


/* =====================================================
   PINTAR
===================================================== */

function pintar() {

  if (!partida) {
    return;
  }


  document.getElementById(
    "puntos1"
  ).textContent =
    partida.puntos1;


  document.getElementById(
    "puntos2"
  ).textContent =
    partida.puntos2;


  document.getElementById(
    "coche1"
  ).textContent =
    partida.coche1;


  document.getElementById(
    "coche2"
  ).textContent =
    partida.coche2;


  document.getElementById(
    "auto1"
  ).textContent =
    partida.coche1;


  document.getElementById(
    "auto2"
  ).textContent =
    partida.coche2;


  /*
   * Movimiento visual de los coches.
   */

  const porcentaje1 =
    (partida.puntos1 /
      TOTAL_PREGUNTAS) * 100;


  const porcentaje2 =
    (partida.puntos2 /
      TOTAL_PREGUNTAS) * 100;


  document.getElementById(
    "auto1"
  ).style.left =
    Math.min(
      porcentaje1,
      90
    ) + "%";


  document.getElementById(
    "auto2"
  ).style.left =
    Math.min(
      porcentaje2,
      90
    ) + "%";


  if (
    partida.turno >=
    TOTAL_PREGUNTAS
  ) {

    finalizar();

    return;

  }


  const soyJugador1 =
    rol === "host";


  const turnoJugador1 =
    partida.turno % 2 === 0;


  const esMiTurno =
    soyJugador1 ===
    turnoJugador1;


  document
    .getElementById("jugador1")
    .classList.toggle(
      "activo",
      turnoJugador1
    );


  document
    .getElementById("jugador2")
    .classList.toggle(
      "activo",
      !turnoJugador1
    );


  if (esMiTurno) {

    mostrarEstado(
      "🟢 Es tu turno"
    );

    mostrarPregunta();

  } else {

    mostrarEstado(
      "🔴 Turno del rival..."
    );

    ocultarPregunta();

  }

}


/* =====================================================
   MOSTRAR PREGUNTA
===================================================== */

function mostrarPregunta() {

  if (
    !partida ||
    !preguntas[partida.turno]
  ) {

    return;

  }


  const pregunta =
    preguntas[partida.turno];


  respondido = false;


  document
    .getElementById("preguntaBox")
    .classList.remove("oculto");


  document.getElementById(
    "textoPregunta"
  ).textContent =
    pregunta.texto;


  const contenedor =
    document.getElementById(
      "opciones"
    );


  contenedor.innerHTML = "";


  pregunta.opciones.forEach(
    (opcion, indice) => {

      const boton =
        document.createElement(
          "button"
        );


      boton.className =
        "opcion";


      boton.textContent =
        opcion;


      boton.addEventListener(
        "click",
        () => responder(indice)
      );


      contenedor.appendChild(
        boton
      );

    }
  );


  iniciarTemporizador();

}


/* =====================================================
   OCULTAR PREGUNTA
===================================================== */

function ocultarPregunta() {

  document
    .getElementById("preguntaBox")
    .classList.add("oculto");


  detenerTemporizador();


  document.getElementById(
    "temporizador"
  ).textContent = "";

}


/* =====================================================
   RESPONDER
===================================================== */

function responder(indice) {

  if (
    respondido ||
    !partida ||
    juegoTerminado
  ) {

    return;

  }


  respondido = true;

  detenerTemporizador();


  /*
   * Bloqueamos botones inmediatamente.
   */

  document
    .querySelectorAll(".opcion")
    .forEach(
      boton => boton.disabled = true
    );


  if (rol === "host") {

    /*
     * El jugador 1 responde
     * directamente en el host.
     */

    if (
      partida.turno % 2 === 0
    ) {

      aplicarRespuesta(
        indice
      );

    }

  } else {

    /*
     * El jugador 2 manda la respuesta
     * al host.
     */

    if (
      connection &&
      connection.open
    ) {

      connection.send({

        type: "answer",

        index: indice

      });

    }

  }

}


/* =====================================================
   APLICAR RESPUESTA
===================================================== */

function aplicarRespuesta(
  indice
) {

  if (
    !partida ||
    partida.turno >= TOTAL_PREGUNTAS
  ) {

    return;

  }


  const pregunta =
    partida.preguntas[
      partida.turno
    ];


  const correcta =
    Number(indice) ===
    Number(pregunta.correcta);


  if (correcta) {

    if (
      partida.turno % 2 === 0
    ) {

      partida.puntos1++;

    } else {

      partida.puntos2++;

    }

  }


  partida.turno++;


  enviarEstado();


  pintar();


  if (
    partida.turno >=
    TOTAL_PREGUNTAS
  ) {

    finalizar();

  }

}


/* =====================================================
   TIEMPO
===================================================== */

function iniciarTemporizador() {

  detenerTemporizador();


  tiempoRestante =
    TIEMPO_PREGUNTA;


  actualizarTemporizador();


  temporizador =
    setInterval(() => {

      tiempoRestante--;


      actualizarTemporizador();


      if (
        tiempoRestante <= 0
      ) {

        detenerTemporizador();


        if (!respondido) {

          responder(-1);

        }

      }

    }, 1000);

}


function actualizarTemporizador() {

  document.getElementById(
    "temporizador"
  ).textContent =
    "⏱️ " +
    tiempoRestante +
    " s";

}


function detenerTemporizador() {

  if (temporizador) {

    clearInterval(
      temporizador
    );

    temporizador = null;

  }

}


/* =====================================================
   FINAL
===================================================== */

function finalizar() {

  if (juegoTerminado) {
    return;
  }


  juegoTerminado = true;


  detenerTemporizador();


  ocultarPregunta();


  const p1 =
    partida?.puntos1 ?? 0;


  const p2 =
    partida?.puntos2 ?? 0;


  let resultado;


  if (p1 === p2) {

    resultado =
      "🤝 ¡Empate!";

  } else if (
    (rol === "host" && p1 > p2) ||
    (rol === "guest" && p2 > p1)
  ) {

    resultado =
      "🏆 ¡Has ganado!";

  } else {

    resultado =
      "😢 Has perdido";

  }


  document.getElementById(
    "resultadoFinal"
  ).textContent =
    resultado;


  document.getElementById(
    "resultadoPuntos"
  ).textContent =
    "Tú: " +
    (rol === "host" ? p1 : p2) +
    " puntos — Rival: " +
    (rol === "host" ? p2 : p1) +
    " puntos";


  document
    .getElementById("pantallaFinal")
    .style.display =
    "flex";

}


/* =====================================================
   LOBBY
===================================================== */

function volverLobby() {

  if (peer) {

    try {
      peer.destroy();
    } catch {}

  }


  window.location.href =
    "lobby.html";

}


/* =====================================================
   ESTADO
===================================================== */

function mostrarEstado(
  texto
) {

  document.getElementById(
    "estado"
  ).textContent =
    texto;

}


/* =====================================================
   LIMPIEZA
===================================================== */

window.addEventListener(
  "beforeunload",
  () => {

    detenerTemporizador();

    if (peer) {

      try {
        peer.destroy();
      } catch {}

    }

  }
);

</script>

</body>
</html>
