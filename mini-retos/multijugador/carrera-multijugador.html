<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Carrera Multijugador DGT</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f1f5f9;color:#1e293b}
header{background:#14532d;color:white;padding:18px;text-align:center}header h1{margin:0 0 8px}header a{color:#fbbf24;text-decoration:none}
.wrap{width:min(950px,94%);margin:22px auto}.card{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 25px #0001}.center{text-align:center}
.race{background:#263a25;border-radius:20px;padding:15px;margin-bottom:18px}.track{height:65px;background:#596d55;border-radius:40px;position:relative;overflow:hidden;margin:8px 0}.track:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff22 0 25px,transparent 25px 50px)}.car{position:absolute;left:1%;top:10px;font-size:38px;transition:left .4s;z-index:2}.finish{position:absolute;right:0;top:0;width:20px;height:100%;background:repeating-linear-gradient(90deg,#fff 0 10px,#111 10px 20px)}
.score{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px;text-align:center}.score div{background:white;border-radius:15px;padding:12px;box-shadow:0 5px 15px #0001}.num{font-size:27px;font-weight:bold;color:#166534}
.turn{text-align:center;padding:13px;border-radius:25px;background:#fbbf24;font-weight:bold;margin-bottom:15px}.turn.wait{background:#64748b;color:white}
.question{background:white;border-radius:20px;padding:25px;box-shadow:0 8px 25px #0001}.qtext{font-size:20px;font-weight:bold;line-height:1.45;margin-bottom:18px}.options{display:grid;gap:10px}.option{border:2px solid #e2e8f0;background:#f8fafc;padding:15px;border-radius:12px;text-align:left;cursor:pointer;font-size:16px}.option:hover:not(:disabled){border-color:#2563eb;background:#eff6ff}.option:disabled{opacity:.6;cursor:not-allowed}
.timer{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-top:10px}.fill{height:100%;width:100%;background:#f59e0b}.loading{text-align:center;padding:40px}.error{color:#991b1b;background:#fee2e2;border-radius:12px;padding:15px}.result{text-align:center;padding:35px}.result h2{font-size:32px}.result button{border:0;border-radius:25px;padding:14px 25px;background:#fbbf24;font-weight:bold;cursor:pointer}
@media(max-width:650px){.score{grid-template-columns:1fr}.qtext{font-size:18px}}
</style>
</head>
<body>
<header><h1>🏁 Carrera Multijugador DGT</h1><div>Sala: <span id="room">------</span> · <a href="lobby.html">Salir</a></div></header>
<div id="app" class="wrap"><div class="card loading"><h2 id="estado">Conectando...</h2><p id="detalle">No cierres esta página.</p></div></div>

<script type="module">
import { preguntasMulti } from "./preguntas-multi.js";

const TOTAL=10;
const TIEMPO=15000;
const PREFIX="aprobadoya-dgt-";

const params=new URLSearchParams(location.search);
const sala=params.get("sala");
const rol=params.get("rol");
const coche=params.get("coche")||"🏎️";

let peer=null;
let conn=null;
let partida=null;
let intervalo=null;
let terminada=false;
let intentoConexion=0;

document.getElementById("room").textContent=sala||"------";

function setEstado(t,d=""){
  const e=document.getElementById("estado"), x=document.getElementById("detalle");
  if(e)e.textContent=t;
  if(x)x.textContent=d;
}

function mezclar(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function crearPreguntas(){
  if(!Array.isArray(preguntasMulti)||!preguntasMulti.length)
    throw new Error("preguntas-multi.js no contiene preguntas.");

  const validas=preguntasMulti.filter(p=>
    p && typeof p.texto==="string" &&
    Array.isArray(p.opciones) && p.opciones.length>=2 &&
    Number.isInteger(Number(p.correcta)) &&
    Number(p.correcta)>=0 && Number(p.correcta)<p.opciones.length
  );

  if(!validas.length) throw new Error("No hay preguntas válidas.");
  return mezclar(validas).slice(0,TOTAL).map(p=>({
    texto:p.texto,
    opciones:[...p.opciones],
    correcta:Number(p.correcta)
  }));
}

function enviar(msg){
  if(conn && conn.open) conn.send(msg);
}

function cerrarTimer(){
  if(intervalo){clearInterval(intervalo);intervalo=null;}
}

function esMiTurno(){
  if(!partida)return false;
  return rol==="host" ? partida.turno%2===0 : partida.turno%2===1;
}

/* ---------- HOST ---------- */
function iniciarHost(){
  setEstado("Creando sala online...","Esperando al segundo jugador.");
  peer=new Peer(PREFIX+sala,{debug:0});

  peer.on("open",()=>{
    setEstado("Sala lista","Código "+sala+". Esperando al rival...");
  });

  peer.on("connection",c=>{
    if(conn){try{c.close()}catch{};return;}
    conn=c;

    conn.on("open",()=>{
      try{
        partida={
          turno:0,
          puntos1:0,
          puntos2:0,
          coche1:coche,
          coche2:(c.metadata&&c.metadata.car)||"🚗",
          preguntas:crearPreguntas(),
          deadline:Date.now()+TIEMPO
        };
      }catch(e){
        console.error(e);
        setEstado("❌ Error con las preguntas",e.message);
        return;
      }
      enviar({type:"state",partida});
      render();
    });

    conn.on("data",msg=>{
      if(msg && msg.type==="answer"){
        recibirRespuestaJugador2(Number(msg.index));
      }
    });

    conn.on("close",()=>{
      if(!terminada)setEstado("❌ El rival se ha desconectado","Vuelve al lobby para crear otra partida.");
    });
  });

  peer.on("error",e=>{
    console.error("PeerJS:",e);
    if(e.type==="unavailable-id")
      setEstado("❌ Código ocupado","Vuelve al lobby y crea otra partida.");
    else
      setEstado("❌ Error de conexión",e.type||"PeerJS");
  });
}

/* ---------- GUEST ---------- */
function iniciarGuest(){
  setEstado("Buscando la partida...","Si el anfitrión aún está entrando, se reintentará automáticamente.");
  peer=new Peer({debug:0});

  peer.on("open",()=>{
    conectarAlHost();
  });

  peer.on("error",e=>{
    console.error("PeerJS guest:",e);
    if(e.type==="network")setEstado("⚠️ Problema de red","Comprueba tu conexión a Internet.");
  });
}

function conectarAlHost(){
  if(terminada || !peer || (conn && conn.open))return;

  intentoConexion++;
  const c=peer.connect(PREFIX+sala,{
    reliable:true,
    serialization:"json",
    metadata:{car:coche}
  });

  let resuelto=false;

  c.on("open",()=>{
    if(resuelto)return;
    resuelto=true;
    conn=c;
    setEstado("✅ Conectado","Esperando la partida...");
  });

  c.on("data",msg=>{
    if(msg && msg.type==="state"){
      partida=msg.partida;
      render();
    }
  });

  c.on("close",()=>{
    if(!terminada)setEstado("❌ El anfitrión se desconectó","Vuelve al lobby para crear otra partida.");
  });

  c.on("error",e=>{
    if(resuelto)return;
    resuelto=true;
    try{c.close()}catch{}
    setEstado("Buscando la partida...","Intento "+intentoConexion);
    setTimeout(conectarAlHost,1200);
  });

  setTimeout(()=>{
    if(!resuelto && !terminada){
      try{c.close()}catch{}
      setTimeout(conectarAlHost,800);
    }
  },2500);
}

/* ---------- JUEGO ---------- */
function recibirRespuestaJugador2(index){
  if(!partida || partida.turno%2!==1 || Date.now()>partida.deadline)return;

  const q=partida.preguntas[partida.turno];
  if(index===q.correcta)partida.puntos2++;

  avanzarTurno();
}

function responder(index){
  if(!partida || terminada || !esMiTurno())return;

  const q=partida.preguntas[partida.turno];

  if(rol==="guest"){
    enviar({type:"answer",index});
    bloquearBotones();
    return;
  }

  if(Date.now()>partida.deadline)return;

  if(index===q.correcta)partida.puntos1++;
  avanzarTurno();
}

function avanzarTurno(){
  cerrarTimer();
  partida.turno++;
  partida.deadline=partida.turno<TOTAL?Date.now()+TIEMPO:0;
  enviar({type:"state",partida});
  render();
}

function tiempoAgotado(){
  if(!partida || !esMiTurno() || Date.now()<partida.deadline)return;

  if(rol==="guest"){
    enviar({type:"answer",index:-1});
    bloquearBotones();
  }else{
    avanzarTurno();
  }
}

function bloquearBotones(){
  document.querySelectorAll(".option").forEach(b=>b.disabled=true);
}

function render(){
  if(!partida)return;
  if(partida.turno>=TOTAL){finalizar();return;}

  cerrarTimer();

  const miTurno=esMiTurno();
  const q=partida.preguntas[partida.turno];
  const p1=partida.puntos1||0, p2=partida.puntos2||0;
  const avance1=Math.min(96,p1/TOTAL*100);
  const avance2=Math.min(96,p2/TOTAL*100);

  document.getElementById("app").innerHTML=`
    <div class="race">
      <div class="track"><div class="car" style="left:${avance1}%">${escapeHtml(partida.coche1)}</div><div class="finish"></div></div>
      <div class="track"><div class="car" style="left:${avance2}%">${escapeHtml(partida.coche2)}</div><div class="finish"></div></div>
    </div>
    <div class="score">
      <div><div class="num">${p1}</div><small>Jugador 1</small></div>
      <div><div class="num">${partida.turno+1}/${TOTAL}</div><small>Pregunta</small></div>
      <div><div class="num">${p2}</div><small>Jugador 2</small></div>
    </div>
    <div class="turn ${miTurno?"":"wait"}">
      ${miTurno?"🎯 TU TURNO":"⏳ Turno del rival"}
      ${miTurno?'<div class="timer"><div id="fill" class="fill"></div></div>':""}
    </div>
    <div class="question">
      <div class="qtext">${escapeHtml(q.texto)}</div>
      <div class="options">
        ${q.opciones.map((o,i)=>`<button class="option" data-i="${i}" ${miTurno?"":"disabled"}>${String.fromCharCode(65+i)}. ${escapeHtml(o)}</button>`).join("")}
      </div>
    </div>
  `;

  document.querySelectorAll(".option").forEach(b=>{
    b.onclick=()=>responder(Number(b.dataset.i));
  });

  if(miTurno)iniciarTimer();
}

function iniciarTimer(){
  const deadline=partida.deadline;
  intervalo=setInterval(()=>{
    const restante=Math.max(0,deadline-Date.now());
    const fill=document.getElementById("fill");
    if(fill)fill.style.width=(restante/TIEMPO*100)+"%";
    if(restante<=0){
      cerrarTimer();
      tiempoAgotado();
    }
  },100);
}

function finalizar(){
  if(terminada)return;
  terminada=true;
  cerrarTimer();

  const p1=partida?.puntos1||0, p2=partida?.puntos2||0;
  const yo=rol==="host"?p1:p2, rival=rol==="host"?p2:p1;
  const texto=yo===rival?"🤝 ¡EMPATE!":yo>rival?"🏆 ¡HAS GANADO!":"😢 HAS PERDIDO";

  document.getElementById("app").innerHTML=`
    <div class="card result">
      <h2>${texto}</h2>
      <p>Tu puntuación: <b>${yo}</b></p>
      <p>Puntuación del rival: <b>${rival}</b></p>
      <button onclick="location.href='lobby.html'">Volver al lobby</button>
    </div>
  `;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

if(!sala || !["host","guest"].includes(rol)){
  setEstado("❌ Partida incorrecta","Vuelve al lobby.");
}else if(rol==="host"){
  try{crearPreguntas();iniciarHost();}
  catch(e){console.error(e);setEstado("❌ Error iniciando la partida",e.message);}
}else{
  iniciarGuest();
}

window.addEventListener("beforeunload",()=>{
  cerrarTimer();
  try{if(peer)peer.destroy()}catch{}
});
</script>
</body>
</html>
